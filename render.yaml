services:
  - type: web
    name: draftmate-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DB_PATH
        value: /tmp/draftmate.db
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: INDIANKANOON_TOKEN
        sync: false
      - key: APP_USER
        value: draftmate
      - key: APP_PASSWORD
        sync: false
